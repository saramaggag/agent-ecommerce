
services:
  postgres:
    image: postgres:18
    container_name: atlas_wear_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: atlas_wear
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: atlas_wear_backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/chroma_data:/app/chroma_data

volumes:
  postgres_data: